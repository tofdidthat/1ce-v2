name: V2 API and frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'history/database/**'
      - 'docs/architecture.md'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'docs/architecture.md'
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit frozen workspace and production dependency graphs
        run: node scripts/audit-dependencies.mjs

  s2-postgres-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: s2_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: onece_s2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s2_ci -d onece_s2_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile TypeScript API for isolated migration smoke
        run: pnpm --filter @1ce/api build
      - name: Check additive migration 010 on disposable PostgreSQL
        env:
          S2_TEST_DATABASE_URL: postgresql://s2_ci:isolated-ci-only@127.0.0.1:5432/onece_s2_ci
        run: node apps/api/scripts/s2-migration-smoke.mjs
      - name: Verify owner-locked uploads, READY files, and pack links on disposable PostgreSQL
        env:
          S2_TEST_DATABASE_URL: postgresql://s2_ci:isolated-ci-only@127.0.0.1:5432/onece_s2_ci
        run: |
          node --check apps/api/scripts/s2-pg-library-integration.mjs
          node apps/api/scripts/s2-pg-library-integration.mjs

  s2-local-s3-syntax-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax only - local S3 integration is opt-in and NOT executed
        run: node --check apps/api/scripts/s2-local-storage-integration.mjs

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run isolated API unit tests
        run: pnpm --filter @1ce/api test
      - name: Syntax-check read-only orphan audit (do not execute)
        run: node --check apps/api/scripts/s2-orphan-audit.mjs
      - name: Syntax-check opt-in real R2 preflight (do not execute or use secrets)
        run: |
          node --check apps/api/scripts/s2-r2-smoke.mjs
          node --check apps/api/scripts/pr57-r2-zip-stems-smoke.mjs
      - name: Syntax-check bounded v2 rate-limit cleanup (do not execute)
        run: node --check apps/api/scripts/s2-rate-limit-cleanup.mjs

  railway-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install like Railpack with frozen workspace dependency graph
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Guard TypeScript-first API and frontend sources
        run: node scripts/check-typescript-policy.mjs
      - name: Verify NodeNext source syntax and compiled TypeScript build
        run: |
          pnpm --filter @1ce/api build
          node --check apps/api/dist/server.js
      - name: Compile API candidate with TypeScript without switching production entry
        run: |
          pnpm --filter @1ce/api build
          test -f apps/api/dist/server.js
          test -f apps/api/dist/trash.js
          test -f apps/api/dist/library-files.js
          node --check apps/api/dist/server.js
      - name: Smoke test compiled API with no external credentials or databases
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { apiServer, apiPool } from './apps/api/dist/server.js';
          try {
            await new Promise((resolve, reject) => {
              apiServer.once('error', reject);
              apiServer.listen(0, '127.0.0.1', resolve);
            });
            const url = `http://127.0.0.1:${apiServer.address().port}`;
            const health = await fetch(`${url}/health`);
            assert.equal(health.status, 200);
            assert.match(health.headers.get('cache-control') ?? '', /no-store/i);
            assert.deepEqual(await health.json(), {ok:true, service:'1ce-v2-api'});
            const unauthorized = await fetch(`${url}/auth/me`);
            assert.equal(unauthorized.status, 401);
            const disallowedOrigin = await fetch(`${url}/auth/me`, {
              headers: {Origin: 'https://untrusted.invalid'},
            });
            assert.equal(disallowedOrigin.status, 403);
            console.log('Compiled API: HEALTHY, no-store, session required, origin enforced');
          } finally {
            await new Promise((resolve) => apiServer.close(resolve));
            await apiPool.end();
          }
          NODE
      - name: Start API from monorepo root and verify health
        shell: bash
        env:
          PORT: '18081'
        run: |
          set -euo pipefail
          pnpm --filter @1ce/api start > "$RUNNER_TEMP/onece-api-smoke.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/health" 2>/dev/null | grep -q '"ok":true'; then
              # Validate response/cache behavior without a live DB or credentials.
              curl -fsS -D "$RUNNER_TEMP/onece-health-headers" -o "$RUNNER_TEMP/onece-health-body" "http://127.0.0.1:$PORT/health"
              grep -Eiq '^cache-control:[[:space:]]*no-store' "$RUNNER_TEMP/onece-health-headers"
              node -e "const x=JSON.parse(require('node:fs').readFileSync(process.argv[1]));if(x.ok!==true||x.service!=='1ce-v2-api')process.exit(1)" "$RUNNER_TEMP/onece-health-body"
              unauth_status=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/auth/me")
              test "$unauth_status" = "401"
              origin_status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Origin: https://untrusted.invalid' "http://127.0.0.1:$PORT/auth/me")
              test "$origin_status" = "403"
              echo "Railway candidate start command: HEALTHY, no-store, unauthorized/private access denied"
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/onece-api-smoke.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/onece-api-smoke.log"
          echo "API did not respond to the health probe" >&2
          exit 1

  web-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Guard TypeScript-first API and frontend sources
        run: node scripts/check-typescript-policy.mjs
      - name: Test web refresh and shared project contracts
        run: node --experimental-strip-types --test apps/web/test/*.test.mjs
      - name: Typecheck and build v2 frontend
        run: pnpm --filter @1ce/web build
