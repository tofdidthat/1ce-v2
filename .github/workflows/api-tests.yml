name: V2 API and frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install v2 API dependencies
        run: npm install --prefix apps/api --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run isolated API unit tests
        run: npm test --prefix apps/api

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install v2 frontend dependencies
        run: npm install --prefix apps/web --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build v2 frontend
        run: npm run build --prefix apps/web
